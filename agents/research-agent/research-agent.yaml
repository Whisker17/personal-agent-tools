name: research-agent
description: Deep research analyst for crypto/DeFi topics, combining web research with codebase analysis
runtime: claude-code
model: claude-sonnet-4-6

system_instructions: agents/research-agent/instructions.md

skills:
  - agents/research-agent/skills/research-outline
  - agents/research-agent/skills/research-deep-output

knowledge: []

parameters:
  - key: mode
    type: text
    description: Optional. "squad" (default) or "standalone". Squad mode requires Orchestrator coordination. When Orchestrator dispatches with report_issue_id, Research Agent posts Research Complete after receiving main_merge_commit. When dispatched without report_issue_id (single-issue lightweight), Research Agent stops at Final Promotion Ready.
  - key: multica_issue_id
    type: text
    description: Multica issue ID for the research task. Used in all message templates and comments.
  - key: topic
    type: text
    description: The research question or subject to investigate
  - key: scope
    type: text
    description: Optional. What aspects to cover. Passed to /research-outline.
  - key: expected_output
    type: text
    description: Optional. What form the final deliverable takes. Passed to /research-outline.
  - key: project_slug
    type: text
    description: Stable project identifier provided by Planner/Orchestrator
  - key: topic_slug
    type: text
    description: Stable topic identifier (never a Linear issue ID)
  - key: branch_name
    type: text
    description: Optional deterministic work branch. Defaults to research/{project_slug}/{topic_slug}. Research artifacts must be written here, not on random runtime branches.
  - key: base_commit
    type: text
    description: Optional. The origin/main SHA to create a new branch from. Orchestrator computes this at first outline dispatch. When absent, worker falls back to latest origin/main.
  - key: report_issue_id
    type: text
    description: Optional. TW reserved issue ID for posting completion summaries. Required in squad mode.
  - key: github_repo
    type: text
    description: Optional. GitHub repo (owner/name) for persistence. Default Whisker17/multica-research
  - key: outline_path
    type: text
    description: Optional. Path to approved outline. Required for Phase B dispatch.
  - key: round
    type: text
    description: Optional. Current round number provided by Orchestrator. Starts at 1, incremented on revision.
  - key: codebase
    type: text
    description: Optional. Repo path or URL to analyze alongside web research
  - key: adversarial_feedback
    type: text
    description: Optional. Structured adversarial review feedback from a previous round. When provided, agent enters revision mode.
  - key: promote
    type: text
    description: Optional. Set to "true" to trigger final promotion mode after quality gate approval.
  - key: approved_draft_path
    type: text
    description: Required for promotion. Path to the approved draft.
  - key: approved_draft_round
    type: text
    description: Required for promotion. Round number of the approved draft.
  - key: approved_draft_commit
    type: text
    description: Required for promotion. Commit URL/SHA of the approved draft.
  - key: approval_evidence
    type: text
    description: Required for promotion. Link to adversarial approval or accept-risk comment.
  - key: final_branch_commit
    type: text
    description: Required for TW handoff. Commit URL/SHA of the promoted final section on the work branch.
  - key: main_merge_commit
    type: text
    description: Required for TW handoff. Commit URL/SHA of Orchestrator's main integration commit containing final.md and _index.md.
  - key: outline_rounds
    type: text
    description: Required for TW handoff. Total outline rounds completed.
  - key: deep_rounds
    type: text
    description: Required for TW handoff. Total deep draft rounds completed.
  - key: order
    type: text
    description: Required for composable final promotion when report_issue_id is present; omitted in single-issue lightweight mode. Section order number for the Index Entry Proposal.
  - key: dependencies
    type: text
    description: Required for composable final promotion when report_issue_id is present; omitted in single-issue lightweight mode. Upstream topic_slug list (comma-separated) or "-" if none.

max_concurrent_tasks: 1
custom_env: {}
custom_args: []
visibility: private
