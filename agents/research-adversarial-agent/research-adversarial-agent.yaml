name: research-adversarial-agent
description: Adversarial reviewer for research outlines and section drafts — challenges structural integrity, coverage, source quality, and logical rigor
runtime: codex
model: gpt-5.5

system_instructions: agents/research-adversarial-agent/instructions.md

skills:
  - agents/research-adversarial-agent/skills/research-review
  - agents/research-adversarial-agent/skills/crypto-adversarial-review
  - github:openai/codex-plugin-cc

knowledge: []

parameters:
  - key: multica_issue_id
    type: text
    description: Multica research issue ID to post review comments on
  - key: review_type
    type: text
    description: '"outline" for Phase A outline review, "draft" for Phase B draft review'
  - key: artifact_path
    type: text
    description: GitHub path to the outline or draft to review
  - key: artifact_commit
    type: text
    description: Commit URL/SHA of the artifact to review
  - key: project_slug
    type: text
    description: Stable project identifier
  - key: topic_slug
    type: text
    description: Stable topic identifier (never a Linear issue ID)
  - key: github_repo
    type: text
    description: Optional. GitHub repo (owner/name). Default Whisker17/multica-research
  - key: round
    type: text
    description: Current round number of the artifact being reviewed
  - key: prior_patches
    type: text
    description: Optional. Summary of patches from previous rounds that were rejected

max_concurrent_tasks: 1
custom_env: {}
custom_args: []
visibility: private
