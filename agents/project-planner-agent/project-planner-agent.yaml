name: project-planner-agent
description: Decomposes Multica research projects into structured issues with parallel-wave dependency graphs, stable slugs, and handoff contracts
runtime: claude-code
model: claude-sonnet-4-6

system_instructions: agents/project-planner-agent/instructions.md

skills:
  - agents/project-planner-agent/skills/project-planner

knowledge: []

parameters:
  - key: project_id
    type: text
    description: The Multica project ID
  - key: project_description
    type: text
    description: Full project description text
  - key: github_repo
    type: text
    description: Target GitHub repository URL (default Whisker17/multica-research)
  - key: orchestrator_context
    type: text
    description: Originating Orchestrator issue/comment context inside the Multica project
  - key: research_depth
    type: text
    description: Expected depth/scope (quick-scan, standard, deep-dive)
  - key: project_slug
    type: text
    description: Optional pre-defined project slug. If missing, Planner derives one.

max_concurrent_tasks: 1
custom_env: {}
custom_args: []
visibility: private
