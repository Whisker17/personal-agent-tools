# Schema:
#
# skills:
#   - name: <skill-name>               # Required. Skill identifier
#     source: <url-or-multica-id>       # Required. Where to find the skill
#     agents: [<agent-name>, ...]       # Required. Which agents should use this skill (must match agents/<name>.yaml)
#     reason: <why-this-skill>          # Required. Justification for adding
#     added: <YYYY-MM-DD>              # Required. Date added
#     last_evaluated: <YYYY-MM-DD>     # Optional. Date of last relevance review (omit until first review)
#     status: evaluating | active | deprecated  # Required. Current status

