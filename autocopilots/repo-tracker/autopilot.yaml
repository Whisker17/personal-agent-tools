name: repo-tracker-autopilot
agent: agents/repo-tracker-agent
schedules:
  daily:
    cron: "0 9 * * *"
    timezone: Asia/Shanghai
    description: Daily PR activity summary
  weekly:
    cron: "0 10 * * 1"
    timezone: Asia/Shanghai
    description: Weekly engineering trend analysis
  monthly:
    cron: "0 10 1 * *"
    timezone: Asia/Shanghai
    description: Monthly strategic overview
